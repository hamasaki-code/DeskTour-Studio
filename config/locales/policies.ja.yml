ja:
  policies:
    shared:
      updated_on: "最終更新日: %{date}"
    privacy:
      title: "プライバシーポリシー"
      description: "DeskTour Studio におけるプロフィール、投稿、運用データの取り扱いについて説明します。"
      eyebrow: "プライバシー"
      lead: "DeskTour Studio がどの情報を扱い、何のために利用し、どのように保持するかをまとめています。"
      summary_heading: "要点"
      summary_points:
        - "プロフィールや投稿の公開に必要な情報だけを扱います。"
        - "安全性、モデレーション、サービス改善のために運用データを利用することがあります。"
        - "自分のプロフィールや投稿を同じ端末から編集できるよう、所有情報を Cookie に保存します。"
      updated_on: "2026年3月12日"
      sections:
        - heading: "1. 取り扱う情報"
          body:
            - "DeskTour Studio では、表示名、プロフィール文、任意で入力したメールアドレス、投稿本文、添付画像、アイテムリンクなどを扱うことがあります。"
            - "加えて、ブラウザ情報、運用ログ、言語設定、モデレーション用の情報など、サービス運営に必要な技術情報を処理することがあります。"
        - heading: "2. 利用目的"
          body:
            - "情報は、プロフィールや投稿の表示、通報対応や不正防止、閲覧体験や投稿体験の改善のために利用されます。"
            - "運営側が有効化している場合に限り、解析や検索連携のための機能を利用することがあります。"
        - heading: "3. 保存と保持"
          body:
            - "公開されたコンテンツは、削除や非表示対応などが行われるまでサービス上に保持されます。"
            - "所有権を示す Cookie は、同じ端末から継続して編集できるよう一定期間ブラウザに保存されます。"
        - heading: "4. 利用者の選択"
          body:
            - "サービスの利用停止、Cookie の削除、所有端末からの編集による内容更新などを行うことができます。"
            - "自分のプロフィールに関するサポートが必要な場合は、登録時に入力したメールアドレスを基準に対応します。"
    terms:
      title: "利用規約"
      description: "DeskTour Studio を利用する際の基本的なルールです。"
      eyebrow: "利用規約"
      lead: "DeskTour Studio で投稿、閲覧、運用を行う際の基本ルールをまとめています。"
      summary_heading: "要点"
      summary_points:
        - "共有する権利のある内容だけを投稿してください。"
        - "違法、攻撃的、誤解を招く、またはスパム的な内容は禁止します。"
        - "安全性を守るため、必要に応じて投稿を非表示または削除することがあります。"
      updated_on: "2026年3月12日"
      sections:
        - heading: "1. 適切な利用"
          body:
            - "ワークスペースに関する内容を、適法な範囲で閲覧・投稿できます。内容は他の閲覧者に誤解を与えない水準で記載してください。"
            - "投稿した画像、説明、リンクについては、投稿者自身が責任を負います。"
        - heading: "2. 禁止事項"
          body:
            - "権利侵害、違法コンテンツ、嫌がらせ、なりすまし、誤認を招くアフィリエイト表現、スパム行為などは禁止します。"
            - "自動取得の乱用やモデレーション回避など、サービス運営を妨げる行為も制限対象になります。"
        - heading: "3. モデレーションと提供内容"
          body:
            - "通報、安全性の懸念、規約違反がある場合、DeskTour Studio は投稿を確認し、非表示または削除することがあります。"
            - "機能や提供内容は、予告なく調整または変更される場合があります。"
        - heading: "4. 外部リンク"
          body:
            - "投稿には外部の商品ページや参考リンクが含まれることがあります。外部サイトの内容やポリシーについて、DeskTour Studio は管理しません。"
    cookie:
      title: "Cookieポリシー"
      description: "DeskTour Studio で利用する Cookie と類似ストレージについて説明します。"
      eyebrow: "Cookie"
      lead: "DeskTour Studio では、主に言語設定、所有状態、基本的な操作継続のために Cookie や類似ストレージを利用します。"
      summary_heading: "要点"
      summary_points:
        - "選択した言語を維持するために言語設定を保存します。"
        - "同じ端末からプロフィールや投稿を編集できるよう、所有トークンを保存します。"
        - "機能が有効化されている場合、解析や運用目的の Cookie が利用されることがあります。"
      updated_on: "2026年3月12日"
      sections:
        - heading: "1. Cookie の種類"
          body:
            - "言語選択、所有状態、いいね状態、基本的な継続利用のために Cookie やブラウザ内ストレージを利用することがあります。"
        - heading: "2. 利用目的"
          body:
            - "これらの値は、選んだ言語を保ち、現在の端末での編集権限を維持し、閲覧体験を安定させるために使われます。"
        - heading: "3. 管理方法"
          body:
            - "Cookie はブラウザ設定からいつでも削除できます。削除すると、その端末での編集権限が失われる場合があります。"
