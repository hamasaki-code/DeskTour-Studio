name: CI

on:
  pull_request:
  push:
    branches: [ main, develop ]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          bundler: latest

      - name: Scan for common Rails security vulnerabilities
        run: bundle exec brakeman --no-pager --no-exit-on-warn

  scan_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bundle exec bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bundle exec rubocop -f github

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y google-chrome-stable curl libjemalloc2 libvips postgresql-client

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Create Test Database
        run: DATABASE_URL=postgres://postgres:postgres@localhost:5432/desktour_studio_test bundle exec bin/rails db:create RAILS_ENV=test
      - name: Load Test Schema
        run: DATABASE_URL=postgres://postgres:postgres@localhost:5432/desktour_studio_test bundle exec bin/rails db:schema:load RAILS_ENV=test

      - name: Check critical i18n fallback usage
        run: ruby script/check_no_default_fallbacks.rb

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/desktour_studio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: DATABASE_URL=postgres://postgres:postgres@localhost:5432/desktour_studio_test bundle exec bin/rails test test:system

      - name: Compare UI screenshots to baseline
        if: always()
        run: ruby script/ui_screenshot_compare.rb

      - name: Upload screenshots for UI review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  accessibility_audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare DB
        run: |
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/desktour_studio_test bundle exec bin/rails db:create RAILS_ENV=test
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/desktour_studio_test bundle exec bin/rails db:schema:load RAILS_ENV=test

      - name: Run accessibility audit
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/desktour_studio_test
        run: bundle exec rake accessibility:audit
