<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Request Rejected | DeskTour Studio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f6f2;
      --surface: #ffffff;
      --border: #d8d4ca;
      --text: #1a1a1a;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.65 "Inter", "Segoe UI", sans-serif;
    }
    .card {
      width: min(720px, 100%);
      border: 1px solid var(--border);
      border-radius: 32px;
      background: var(--surface);
      padding: 32px;
      box-shadow: 0 24px 80px rgba(26,26,26,0.08);
    }
    .eyebrow {
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    p {
      margin: 16px 0 0;
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">DeskTour Studio</p>
    <h1>The requested change was rejected.</h1>
    <p>Please try again from the previous page. If the issue persists, contact support and include what you were doing.</p>
    <div class="actions">
      <a href="/">Back to home</a>
      <a href="/support">Contact support</a>
    </div>
  </main>
</body>
</html>
